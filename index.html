<style>
:root {
  --bg: #F2F6F5;
  --surface: #FFFFFF;
  --surface-2: #E7EFEE;
  --border: #D8E3E1;
  --ink: #12302E;
  --ink-muted: #4B6461;
  --primary: #0E5A66;
  --primary-ink: #FFFFFF;
  --accent: #C89B4A;
  --positive: #2E8F5D;
  --negative: #C1473C;
  --shadow: 0 1px 2px rgba(18,48,46,0.06), 0 4px 14px rgba(18,48,46,0.07);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1E20;
    --surface: #10282A;
    --surface-2: #163134;
    --border: #1E3B3D;
    --ink: #E7F2EF;
    --ink-muted: #9FB8B4;
    --primary: #4FB8C4;
    --primary-ink: #06181A;
    --accent: #E0B565;
    --positive: #4FC685;
    --negative: #E27167;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0A1E20; --surface: #10282A; --surface-2: #163134; --border: #1E3B3D;
  --ink: #E7F2EF; --ink-muted: #9FB8B4; --primary: #4FB8C4; --primary-ink: #06181A;
  --accent: #E0B565; --positive: #4FC685; --negative: #E27167;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
}
:root[data-theme="light"] {
  --bg: #F2F6F5; --surface: #FFFFFF; --surface-2: #E7EFEE; --border: #D8E3E1;
  --ink: #12302E; --ink-muted: #4B6461; --primary: #0E5A66; --primary-ink: #FFFFFF;
  --accent: #C89B4A; --positive: #2E8F5D; --negative: #C1473C;
  --shadow: 0 1px 2px rgba(18,48,46,0.06), 0 4px 14px rgba(18,48,46,0.07);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overscroll-behavior-y: none; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
h1, h2, .display {
  font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
  text-wrap: balance;
}
.num { font-variant-numeric: tabular-nums; }

#app { display: flex; flex-direction: column; min-height: 100vh; }

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + var(--safe-top)) 16px 10px;
  background: var(--primary);
  color: var(--primary-ink);
  box-shadow: var(--shadow);
}
.header-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.app-title { font-size: 1.28rem; font-weight: 600; margin: 0; letter-spacing: 0.2px; }
.app-title .baht { color: var(--accent); }

.segmented {
  display: inline-flex; background: rgba(255,255,255,0.16); border-radius: 999px; padding: 3px;
}
:root[data-theme="light"] .segmented, @media (prefers-color-scheme: light) { }
.segmented button {
  border: none; background: transparent; color: inherit; opacity: 0.75;
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.4px;
  padding: 5px 12px; border-radius: 999px; cursor: pointer;
}
.segmented button.active { background: var(--surface); color: var(--primary); opacity: 1; }

.month-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px; overflow-x: auto;
  padding-bottom: 2px; scrollbar-width: none;
}
.month-row::-webkit-scrollbar { display: none; }
.month-chip {
  flex: 0 0 auto; font-size: 0.82rem; font-weight: 600; padding: 6px 13px; border-radius: 999px;
  background: rgba(255,255,255,0.14); color: var(--primary-ink); opacity: 0.75; border: none; cursor: pointer;
  white-space: nowrap;
}
.month-chip.active { background: var(--surface); color: var(--primary); opacity: 1; }
.month-chip.add { opacity: 0.6; }

/* ---------- main content ---------- */
main { flex: 1; padding: 16px 16px calc(90px + var(--safe-bottom)); max-width: 640px; margin: 0 auto; width: 100%; }
.tab { display: none; }
.tab.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .tab.active { animation: none; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.card h2 {
  margin: 0 0 12px; font-size: 0.72rem; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--ink-muted);
}

/* hero summary */
.hero-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.hero-label { font-size: 0.88rem; color: var(--ink-muted); }
.hero-value { font-size: 1.02rem; font-weight: 600; }
.hero-total { border-top: 1px solid var(--accent); margin-top: 10px; padding-top: 12px; }
.hero-total .hero-value { font-size: 1.5rem; font-family: ui-serif, "New York", Georgia, serif; }
.hero-total .hero-value.positive { color: var(--positive); }
.hero-total .hero-value.negative { color: var(--negative); }
.hero-sub { font-size: 0.82rem; color: var(--ink-muted); margin-top: 2px; }
.hero-sub.right { text-align: right; margin-top: 0; margin-bottom: 6px; font-size: 0.76rem; }
.field-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.field-hint { font-size: 0.72rem; color: var(--ink-muted); }
.unit-toggle { display: inline-flex; gap: 4px; }
.unit-btn {
  font-size: 0.74rem; font-weight: 700; padding: 3px 9px; border-radius: 999px;
  background: rgba(127,127,127,0.14); color: var(--ink-muted);
  border: 1px solid var(--border); cursor: pointer;
}
.unit-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.rate-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; }
.btn-rate { font-size: 0.78rem; padding: 6px 12px; margin-top: 0; white-space: nowrap; }

.scan-box { margin-top: 12px; }
.scan-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.scan-row .btn { margin-top: 0; flex: 0 0 auto; font-size: 0.82rem; padding: 8px 12px; }
.scan-hint { font-size: 0.72rem; color: var(--ink-muted); margin-top: 6px; line-height: 1.45; }
.scan-preview { margin-top: 10px; display: none; }
.scan-preview img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
.scan-preview.shown { display: block; }
.scan-clear { margin-top: 6px; font-size: 0.74rem; color: var(--negative);
  background: none; border: none; cursor: pointer; padding: 2px 0; }
.entry-box { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.entry-box h4 { margin: 0 0 2px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--ink-muted); }
.entry-list { margin: 8px 0; }
.entry-item { display: flex; align-items: center; gap: 8px; padding: 7px 0;
  border-bottom: 1px solid var(--border); font-size: 0.86rem; }
.entry-item:last-child { border-bottom: none; }
.entry-date { color: var(--ink-muted); white-space: nowrap; font-size: 0.8rem; }
.entry-note { color: var(--ink-muted); font-style: italic; flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.entry-amount { font-weight: 600; white-space: nowrap; margin-left: auto; }
.entry-del { border: none; background: transparent; color: var(--negative); cursor: pointer;
  font-size: 1.05rem; line-height: 1; padding: 2px 4px; }
.entry-add { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.entry-add input { border: 1px solid var(--border); background: var(--surface-2); color: var(--ink);
  border-radius: 8px; padding: 7px 8px; font-size: 0.85rem; font-family: inherit; min-width: 0; }
.entry-add input[type="date"] { flex: 1 1 36%; }
.entry-add input.amount { flex: 1 1 24%; text-align: right; }
.entry-add input.note { flex: 1 1 100%; }
.entry-add .btn { flex: 0 0 auto; margin-top: 0; padding: 8px 12px; font-size: 0.82rem; }
.entry-sum { font-weight: 700; font-size: 0.88rem; margin-top: 8px; }
.entry-empty { color: var(--ink-muted); font-size: 0.8rem; padding: 6px 0; }
.ist-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.ist-row:last-child { border-bottom: none; }
.ist-name { font-size: 0.93rem; }
.ist-comment { font-size: 0.74rem; color: var(--ink-muted); margin-top: 2px; font-style: italic; }
.ist-values { text-align: right; white-space: nowrap; }
.ist-plan { font-size: 0.74rem; color: var(--ink-muted); }
.ist-actual { font-weight: 600; }
.ist-actual.open { color: var(--ink-muted); font-weight: 400; }
.ist-diff { font-size: 0.74rem; }
.ist-diff.over { color: var(--negative); }
.ist-diff.under { color: var(--positive); }
.ist-sum {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 12px 0 2px; margin-top: 4px; border-top: 2px solid var(--border); font-weight: 700;
}
.ist-note { font-size: 0.76rem; color: var(--ink-muted); margin-bottom: 10px; }
.ist-actions { display: flex; gap: 8px; margin-top: 14px; }
.ist-actions .btn { flex: 1; margin-top: 0; font-size: 0.8rem; padding: 9px 10px; }
#istList { padding-bottom: 20px; }
.ratio-bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 14px; }
.ratio-fill { height: 100%; background: var(--primary); border-radius: 999px; transition: width .3s ease; }
.ratio-fill.over { background: var(--negative); }
.ratio-caption { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--ink-muted); margin-top: 6px; }

/* form rows */
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: none; }
.field label { font-size: 0.92rem; color: var(--ink-muted); }
.field input {
  border: none; background: transparent; text-align: right; font-size: 1rem; color: var(--ink);
  width: 130px; font-family: inherit; padding: 4px 2px;
}
.field input:focus { outline: none; border-bottom: 2px solid var(--accent); }

.btn {
  border: none; border-radius: 12px; padding: 11px 16px; font-size: 0.92rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.btn-primary { background: var(--primary); color: var(--primary-ink); width: 100%; margin-top: 14px; }
.btn-primary:active { opacity: 0.85; }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-danger { background: transparent; color: var(--negative); }

/* expenses list */
.expense-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer;
}
.expense-row:last-child { border-bottom: none; }
.expense-name { font-size: 0.95rem; }
.expense-currency { font-size: 0.72rem; color: var(--ink-muted); }
.expense-amount { font-weight: 600; white-space: nowrap; text-align: right; }
.expense-eur { font-size: 0.75rem; color: var(--ink-muted); font-weight: 400; white-space: nowrap; }
.sort-bar { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 4px; }
.sort-label { font-size: 0.72rem; color: var(--ink-muted); margin-right: 2px; }
.sort-chip {
  flex: 0 0 auto; font-size: 0.76rem; font-weight: 600; padding: 5px 11px; border-radius: 999px;
  background: var(--surface-2, rgba(127,127,127,0.14)); color: var(--ink-muted);
  border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
}
.sort-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.expense-sum {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 0 2px; margin-top: 4px; border-top: 2px solid var(--border); font-weight: 700;
}
/* Platz lassen, damit der +-Knopf die Summenzeile nicht verdeckt */
#expenseList { padding-bottom: 140px; }
.fab {
  position: fixed; right: 20px; bottom: calc(86px + var(--safe-bottom)); z-index: 15;
  width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #2A2004;
  border: none; font-size: 1.6rem; box-shadow: var(--shadow); cursor: pointer;
}

/* history table */
.hist-table { border-collapse: collapse; font-size: 0.86rem; min-width: 560px; }
.hist-table th { text-align: right; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); padding: 0 14px 8px 0; font-weight: 600; white-space: nowrap; }
.hist-table th:first-child, .hist-table td:first-child { text-align: left; padding-left: 0; }
.hist-table td { text-align: right; padding: 9px 14px 9px 0; border-top: 1px solid var(--border); white-space: nowrap; }
.hist-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }

/* bottom tab bar */
nav.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; padding-bottom: var(--safe-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
}
nav.tabbar button {
  flex: 1; border: none; background: none; padding: 10px 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-muted); font-family: inherit;
}
nav.tabbar button.active { color: var(--primary); }
nav.tabbar .icon { width: 22px; height: 22px; }
nav.tabbar .label { font-size: 0.68rem; font-weight: 600; }

/* modal / bottom sheet */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(6,20,20,0.45); z-index: 30;
  display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  background: var(--surface); width: 100%; border-radius: 20px 20px 0 0;
  padding: 10px 20px calc(24px + var(--safe-bottom)); transform: translateY(100%); transition: transform .25s ease;
  max-width: 640px; margin: 0 auto;
}
.sheet-overlay.open .sheet { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 6px auto 14px; }
.sheet h3 { margin: 0 0 14px; font-size: 1.05rem; }
.sheet .field input, .sheet .field select { text-align: right; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { flex: 1; margin-top: 0; }

select {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 8px; font-family: inherit; font-size: 0.95rem;
}

.empty-hint { text-align: center; color: var(--ink-muted); font-size: 0.85rem; padding: 20px 0; }
.sync-hint { color: var(--ink-muted); font-size: 0.8rem; line-height: 1.45; margin-bottom: 12px; }
.sync-row { display: flex; gap: 10px; }
.sync-row .btn { flex: 1; margin-top: 0; }
</style>

<body>
<div id="app">
  <header>
    <div class="header-row">
      <h1 class="app-title"><span class="baht">฿</span> <span id="appTitleText">Budget Koh Samui</span></h1>
      <div class="segmented" id="langSwitch">
        <button data-lang="de">DE</button>
        <button data-lang="th">TH</button>
      </div>
    </div>
    <div class="month-row" id="monthRow"></div>
  </header>

  <main>
    <section class="tab active" id="tab-overview">
      <div class="card" id="heroCard">
        <h2 id="lbl_result">ERGEBNIS</h2>
        <div class="hero-row"><span class="hero-label" id="lbl_gross_thb">Bruttogehalt</span><span class="hero-value num" id="val_gross_thb">–</span></div>
        <div class="hero-sub right num" id="val_gross_eur"></div>
        <div class="hero-row"><span class="hero-label" id="lbl_deductions">abzgl. Abgaben</span><span class="hero-value num" id="val_deductions">–</span></div>
        <div class="hero-row"><span class="hero-label" id="lbl_net_thb">Nettoeinkommen</span><span class="hero-value num" id="val_net_thb">–</span></div>
        <div class="hero-sub right num" id="val_net_eur"></div>
        <div class="hero-row"><span class="hero-label" id="lbl_total_exp">Summe Ausgaben</span><span class="hero-value num" id="val_total_exp">–</span></div>
        <div class="hero-sub right num" id="val_total_exp_eur"></div>
        <div class="hero-total hero-row">
          <span class="hero-label" id="lbl_reserve_thb">Rücklage (Baht)</span>
          <span class="hero-value num" id="val_reserve_thb">–</span>
        </div>
        <div class="hero-sub num" id="val_reserve_eur"></div>
        <div class="ratio-bar"><div class="ratio-fill" id="ratioFill" style="width:0%"></div></div>
        <div class="ratio-caption"><span id="lbl_ratio">Ausgabenquote vom Netto</span><span class="num" id="val_ratio">–</span></div>
      </div>

      <div class="card">
        <h2 id="lbl_assumptions">ANNAHMEN</h2>
        <div class="field">
          <label id="lbl_rate">Wechselkurs (1 EUR = ... THB)</label>
          <input type="number" inputmode="decimal" step="0.01" id="input_rate">
        </div>
        <div class="rate-row">
          <span class="field-hint" id="lbl_rate_info"></span>
          <button class="btn btn-ghost btn-rate" id="btnFetchRate">Kurs holen</button>
        </div>
        <div class="field">
          <label id="lbl_salary">Bruttogehalt (Baht)</label>
          <div class="field-col">
            <input type="number" inputmode="decimal" step="100" id="input_salary">
            <span class="field-hint" id="lbl_salary_eur"></span>
          </div>
        </div>
        <div class="field">
          <label id="lbl_tax">Steuern</label>
          <div class="field-col">
            <input type="number" inputmode="decimal" step="0.1" id="input_tax">
            <span class="unit-toggle" id="taxUnit"></span>
            <span class="field-hint" id="lbl_tax_calc"></span>
          </div>
        </div>
        <div class="field">
          <label id="lbl_social">Sozialabgaben</label>
          <div class="field-col">
            <input type="number" inputmode="decimal" step="0.1" id="input_social">
            <span class="unit-toggle" id="socialUnit"></span>
            <span class="field-hint" id="lbl_social_calc"></span>
          </div>
        </div>
        <button class="btn btn-primary" id="btnApply">Übernehmen</button>
      </div>

      <div class="card">
        <h2 id="lbl_sync">SYNC</h2>
        <div class="sync-hint" id="lbl_sync_hint"></div>
        <div class="sync-row">
          <button class="btn btn-ghost" id="btnExport">Export</button>
          <button class="btn btn-ghost" id="btnImport">Import</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </section>

    <section class="tab" id="tab-expenses">
      <div class="card">
        <h2 id="lbl_expenses">AUSGABEN</h2>
        <div class="sort-bar" id="sortBar"></div>
        <div id="expenseList"></div>
      </div>
      <button class="fab" id="btnAddExpense" aria-label="Hinzufügen">+</button>
    </section>


    <section class="tab" id="tab-actual">
      <div class="card">
        <h2 id="lbl_actual">SOLL/IST</h2>
        <div class="ist-note" id="lbl_ist_note"></div>
        <div id="istList"></div>
        <div class="ist-actions">
          <button class="btn btn-ghost" id="btnCopyPlan">Geplante Werte</button>
          <button class="btn btn-ghost" id="btnClearActual">Zurücksetzen</button>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-history">
      <div class="card">
        <h2 id="lbl_history">VERLAUF</h2>
        <div class="hist-scroll">
          <table class="hist-table" id="histTable"></table>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="overview" class="active">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12l8-7 8 7"/><path d="M6 10.5V20h12v-9.5"/></svg>
      <span class="label" id="tabbtn_overview">Übersicht</span>
    </button>
    <button data-tab="expenses">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M9 15h6"/></svg>
      <span class="label" id="tabbtn_expenses">Ausgaben</span>
    </button>
    <button data-tab="actual">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M4 12h7M4 17h13"/><path d="M17 5l3 3-3 3"/></svg>
      <span class="label" id="tabbtn_actual">Soll/Ist</span>
    </button>
    <button data-tab="history">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="label" id="tabbtn_history">Verlauf</span>
    </button>
  </nav>
</div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

  function load() {
    try {

      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.months && Object.keys(d.months).length) return migrateData(d);
      }
    } catch (e) {}
    var fresh = JSON.parse(JSON.stringify(DEFAULT_DATA));
    save(fresh);
    return fresh;
  }
  // Speichern darf nie die App lahmlegen: im privaten Modus oder bei
  // gesperrtem Speicher laeuft sie ohne Persistenz weiter.
  function save(d) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {}
  }

  function itemName(item) { return (state.language === "th" ? item.nameTh : item.nameDe) || item.nameDe || item.nameTh || ""; }

  function fmtThb(x) {
    var s = Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return s + " ฿";
  }
  function fmtEur(x) {
    var s = x.toFixed(2);
    var parts = s.split(".");
    var intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return intPart + "," + parts[1] + " €";
  }
  function expenseThb(item, rate) { return item.waehrung === "EUR" ? item.betrag * rate : item.betrag; }
  function expenseEur(item, rate) { return item.waehrung === "EUR" ? item.betrag : (rate ? item.betrag / rate : 0); }

    var sv = JSON.parse(localStorage.getItem("budgetKohSamuiSort") || "null");
    if (sv && (sv.key === "name" || sv.key === "amount")) { sortKey = sv.key; sortDesc = !!sv.desc; }
  } catch (e) {}
  function saveSort() {
    try { localStorage.setItem("budgetKohSamuiSort", JSON.stringify({ key: sortKey, desc: sortDesc })); } catch (e) {}
  }

  function sortedExpenses() {
    // Paare [echterIndex, posten], damit Bearbeiten den richtigen Datensatz trifft
    var month = currentMonth();
    var pairs = month.ausgaben.map(function (it, i) { return [i, it]; });
    if (!sortKey) return pairs;
    var rate = month.wechselkurs;
    pairs.sort(function (a, b) {
      var r;
      if (sortKey === "name") r = itemName(a[1]).toLowerCase() < itemName(b[1]).toLowerCase() ? -1 :
                                  (itemName(a[1]).toLowerCase() > itemName(b[1]).toLowerCase() ? 1 : 0);
      else r = expenseThb(a[1], rate) - expenseThb(b[1], rate);
      return sortDesc ? -r : r;
    });
    return pairs;
  }

  function setSort(key) {
    // dreistufig: erster Klick -> zweiter dreht um -> dritter zurueck zur Eingabe
    if (sortKey !== key) { sortKey = key; sortDesc = (key === "amount"); }
    else if (sortDesc === (key === "amount")) { sortDesc = !sortDesc; }
    else { sortKey = null; sortDesc = false; }
    saveSort();
    renderSortBar();
    renderExpenses();
  }

  // Alte Monatsdaten auf Baht-Gehalt + zwei Abzuege umstellen.
  function migrateMonth(m) {
    var rate = Number(m.wechselkurs) || 38.4;
    m.wechselkurs = rate;
    if (m.kursDatum == null) m.kursDatum = "";
    if (m.gehaltBruttoThb == null) {
      // Betrag beibehalten: altes EUR-Gehalt zum gespeicherten Kurs umrechnen
      m.gehaltBruttoThb = (Number(m.gehaltBruttoEur) || 0) * rate;
    }
    m.gehaltBruttoThb = Number(m.gehaltBruttoThb) || 0;
    delete m.gehaltBruttoEur;
    if (m.steuerWert == null) { m.steuerWert = (Number(m.steuersatz) || 0) * 100; m.steuerArt = "pct"; }
    delete m.steuersatz;
    m.steuerWert = Number(m.steuerWert) || 0;
    if (m.steuerArt !== "pct" && m.steuerArt !== "thb") m.steuerArt = "pct";
    m.sozialWert = Number(m.sozialWert) || 0;
    if (m.sozialArt !== "pct" && m.sozialArt !== "thb") m.sozialArt = "pct";
    if (!m.ausgaben) m.ausgaben = [];
    m.ausgaben.forEach(function (i) {
      // null = noch nicht eingetragen
      if (i.istBetrag == null || isNaN(Number(i.istBetrag))) i.istBetrag = null;
      else i.istBetrag = Number(i.istBetrag);
      if (i.kommentarDe == null) i.kommentarDe = "";
      if (i.kommentarTh == null) i.kommentarTh = "";
      i.eintraege = (i.eintraege || []).map(function (e) {
        return { datum: String(e.datum || ""), betrag: Number(e.betrag) || 0,
                 notiz: String(e.notiz || "") };
      });
    });
    return m;
  }
  function migrateData(d) {
    Object.keys(d.months || {}).forEach(function (k) { migrateMonth(d.months[k]); });
    return d;
  }

  // Soll/Ist: istBetrag === null bedeutet "noch nicht eingetragen" und zaehlt als 0
  // Gibt es Einzelbuchungen, zaehlt deren Summe - sonst der Einzelbetrag.
  function istWert(item) {
    var e = item.eintraege || [];
    if (e.length) return e.reduce(function (s, x) { return s + x.betrag; }, 0);
    return item.istBetrag;
  }
  function heuteISO() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function istThb(item, rate) {
    var w = istWert(item);
    if (w == null) return 0;
    return item.waehrung === "EUR" ? w * rate : w;
  }
  function istOffen(item) { return istWert(item) == null; }

  function abzugThb(bruttoThb, wert, art) {
    return art === "pct" ? bruttoThb * wert / 100 : wert;
  }

  function compute(month) {
    var rate = month.wechselkurs;
    var bruttoThb = month.gehaltBruttoThb;
    var steuerThb = abzugThb(bruttoThb, month.steuerWert, month.steuerArt);
    var sozialThb = abzugThb(bruttoThb, month.sozialWert, month.sozialArt);
    var nettoThb = bruttoThb - steuerThb - sozialThb;
    var totalAusgabenThb = month.ausgaben.reduce(function (sum, it) { return sum + expenseThb(it, rate); }, 0);
    var ruecklageThb = nettoThb - totalAusgabenThb;
    var toEur = function (x) { return rate ? x / rate : 0; };
    var quote = nettoThb ? totalAusgabenThb / nettoThb : 0;
    var totalIstThb = month.ausgaben.reduce(function (s, it) { return s + istThb(it, rate); }, 0);
    var offen = month.ausgaben.filter(istOffen).length;
    var ruecklageIstThb = nettoThb - totalIstThb;
    return { rate: rate, bruttoThb: bruttoThb, bruttoEur: toEur(bruttoThb),
             totalIstThb: totalIstThb, totalIstEur: toEur(totalIstThb),
             diffThb: totalIstThb - totalAusgabenThb, offen: offen,
             ruecklageIstThb: ruecklageIstThb, ruecklageIstEur: toEur(ruecklageIstThb),
             steuerThb: steuerThb, sozialThb: sozialThb, abzuegeThb: steuerThb + sozialThb,
             nettoThb: nettoThb, nettoEur: toEur(nettoThb),
             totalAusgabenThb: totalAusgabenThb, totalAusgabenEur: toEur(totalAusgabenThb),
             ruecklageThb: ruecklageThb, ruecklageEur: toEur(ruecklageThb), quote: quote };
  }

  // Tageskurs EUR->THB; primaer EZB-Referenzkurs, sonst Ausweichquelle.
  // Es werden nur oeffentliche Kursdaten abgefragt, keine Budgetdaten gesendet.
  function fetchRate() {
    var quellen = [
      ["https://api.frankfurter.dev/v1/latest?base=EUR&symbols=THB",
       function (d) { return [Number(d.rates.THB), d.date || ""]; }],
      ["https://open.er-api.com/v6/latest/EUR",
       function (d) { return [Number(d.rates.THB), (d.time_last_update_utc || "").slice(0, 16)]; }]
    ];
    var i = 0;
    function next() {
      if (i >= quellen.length) return Promise.reject(new Error("keine Kursquelle erreichbar"));
      var q = quellen[i++];
      return fetch(q[0], { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (d) {
          var p = q[1](d);
          if (!(p[0] > 0)) throw new Error("kein Kurs erhalten");
          return p;
        })
        .catch(function () { return next(); });
    }
    return next();
  }

    sortedExpenses().forEach(function (pair) {

      var plan = expenseThb(item, rate);
      var row = document.createElement("div");
      row.className = "ist-row";
      var komm = istKommentar(item);
      var anzahl = (item.eintraege || []).length;
      if (anzahl) {
        var z = t("entryCount").replace("{n}", anzahl);

                 '<div class="ist-actual open">' + t("notEntered") + '</div>';

                 '<div class="ist-actual num">' + fmtThb(ist) + '</div>' +
                 '<div class="ist-diff' + kl + ' num">' + (diff > 0 ? "+" : "") + fmtThb(diff) + '</div>';
      }
      row.innerHTML =
        '<div><div class="ist-name">' + escapeHtml(itemName(item)) + '</div>' +
        (komm ? '<div class="ist-comment">' + escapeHtml(komm) + '</div>' : '') + '</div>' +
        '<div class="ist-values">' + rechts + '</div>';

    var r = compute(month);

      '<div class="ist-plan">' + t("colPlan") + ": " + fmtThb(r.totalAusgabenThb) + '</div>' +
      '<div class="ist-actual num">' + fmtThb(r.totalIstThb) + '</div>' +

  }

      box.querySelector("img").src = scanUrl;
      box.classList.add("shown");

      box.classList.remove("shown");

                            notiz: document.getElementById("sh_e_notiz").value.trim() });
      item.eintraege.sort(function (a, b) { return a.datum < b.datum ? -1 : (a.datum > b.datum ? 1 : 0); });
      document.getElementById("sh_e_betrag").value = "";
      document.getElementById("sh_e_notiz").value = "";

      item.kommentarDe = document.getElementById("sh_komm_de").value.trim();
      item.kommentarTh = document.getElementById("sh_komm_th").value.trim();
      save(state); closeSheet(); renderAll();
    };
  }

  // Beim Umschalten %/฿ den Betrag umrechnen, damit der Abzug gleich bleibt.
  function wechsleEinheit(welcher, neueArt) {
    var m = currentMonth();
    var wertFeld = welcher === "steuer" ? "steuerWert" : "sozialWert";
    var artFeld = welcher === "steuer" ? "steuerArt" : "sozialArt";
    if (m[artFeld] === neueArt) return;
    var brutto = m.gehaltBruttoThb;
    if (neueArt === "thb") m[wertFeld] = brutto * m[wertFeld] / 100;
    else m[wertFeld] = brutto ? m[wertFeld] / brutto * 100 : 0;
    m[wertFeld] = Math.round(m[wertFeld] * 10000) / 10000;
    m[artFeld] = neueArt;
    save(state);
    renderAll();
  }

  function renderOverview() {
    var month = currentMonth();
    var r = compute(month);
    document.getElementById("val_gross_thb").textContent = fmtThb(r.bruttoThb);
    document.getElementById("val_gross_eur").textContent = "≈ " + fmtEur(r.bruttoEur);
    document.getElementById("val_deductions").textContent = "− " + fmtThb(r.abzuegeThb);
    document.getElementById("val_net_thb").textContent = fmtThb(r.nettoThb);
    document.getElementById("val_net_eur").textContent = "≈ " + fmtEur(r.nettoEur);
    document.getElementById("val_total_exp").textContent = fmtThb(r.totalAusgabenThb);
    document.getElementById("val_total_exp_eur").textContent = "≈ " + fmtEur(r.totalAusgabenEur);
    var resEl = document.getElementById("val_reserve_thb");
    resEl.textContent = fmtThb(r.ruecklageThb);
    resEl.className = "hero-value num " + (r.ruecklageThb >= 0 ? "positive" : "negative");
    document.getElementById("val_reserve_eur").textContent = "≈ " + fmtEur(r.ruecklageEur);
    var pct = Math.min(100, Math.max(0, r.quote * 100));
    var fill = document.getElementById("ratioFill");
    fill.style.width = pct + "%";
    fill.classList.toggle("over", r.quote > 1);
    document.getElementById("val_ratio").textContent = (r.quote * 100).toFixed(1).replace(".", ",") + " %";

    document.getElementById("input_rate").value = month.wechselkurs;
    document.getElementById("input_salary").value = month.gehaltBruttoThb;
    document.getElementById("input_tax").value = month.steuerWert;
    document.getElementById("input_social").value = month.sozialWert;

    document.getElementById("lbl_rate_info").textContent =
      month.kursDatum ? t("rateFrom").replace("{date}", month.kursDatum) : t("rateManual");
    document.getElementById("lbl_salary_eur").textContent = "≈ " + fmtEur(r.bruttoEur);
    document.getElementById("lbl_tax_calc").textContent =
      month.steuerArt === "pct" ? "= " + fmtThb(r.steuerThb) : "";
    document.getElementById("lbl_social_calc").textContent =
      month.sozialArt === "pct" ? "= " + fmtThb(r.sozialThb) : "";

    renderUnitToggle("taxUnit", month.steuerArt, function (art) { wechsleEinheit("steuer", art); });
    renderUnitToggle("socialUnit", month.sozialArt, function (art) { wechsleEinheit("sozial", art); });
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  function renderExpenses() {
    var month = currentMonth();
    var list = document.getElementById("expenseList");
    list.innerHTML = "";
    if (!month.ausgaben.length) {
      var p = document.createElement("div");
      p.className = "empty-hint";
      p.textContent = t("emptyExpenses");
      list.appendChild(p);
      return;
    }
    var rate = month.wechselkurs;
    sortedExpenses().forEach(function (pair) {
      var idx = pair[0], item = pair[1];
      var row = document.createElement("div");
      row.className = "expense-row";
      row.innerHTML =
        '<div><div class="expense-name">' + escapeHtml(itemName(item)) + '</div>' +
        (item.waehrung === "EUR" ? '<div class="expense-currency">' + item.betrag.toFixed(2) + ' EUR</div>' : '') +
        '</div><div class="expense-amount num">' + fmtThb(expenseThb(item, rate)) +
        '<div class="expense-eur num">' + fmtEur(expenseEur(item, rate)) + '</div></div>';
      row.onclick = function () { openExpenseSheet(idx); };
      list.appendChild(row);
    });

    var totalThb = month.ausgaben.reduce(function (s, i) { return s + expenseThb(i, rate); }, 0);
    var totalEur = month.ausgaben.reduce(function (s, i) { return s + expenseEur(i, rate); }, 0);
    var sum = document.createElement("div");
    sum.className = "expense-sum";
    sum.innerHTML = '<div>' + t("sumRow") + '</div><div class="expense-amount num">' + fmtThb(totalThb) +
      '<div class="expense-eur num">' + fmtEur(totalEur) + '</div></div>';
    list.appendChild(sum);
  }

  function renderHistory() {
    var table = document.getElementById("histTable");
    var rows = ['<tr><th>' + t("histMonth") + '</th><th>' + t("histNet") + '</th><th>' + t("histExp") +
      '</th><th>' + t("histExpIst") + '</th><th>' + t("histResThb") + '</th><th>' + t("histResEur") + '</th></tr>'];
    Object.keys(state.months).forEach(function (name) {
      var r = compute(state.months[name]);
      rows.push('<tr><td>' + escapeHtml(name) + '</td><td class="num">' + fmtThb(r.nettoThb) +
        '</td><td class="num">' + fmtThb(r.totalAusgabenThb) +
        '</td><td class="num">' + (r.offen === state.months[name].ausgaben.length ? "–" : fmtThb(r.totalIstThb)) +
        '</td><td class="num">' + fmtThb(r.ruecklageThb) +
        '</td><td class="num">' + fmtEur(r.ruecklageEur) + '</td></tr>');
    });
    table.innerHTML = rows.join("");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ------------------------------------------------------------ sync
  // Austauschformat = dieses camelCase-Format. normalize() nimmt zusätzlich
  // das snake_case-Format der Mac-App an, damit beide Richtungen passen.
  function normalizeImported(obj) {
    // umhuelltes Export-Format {app, version, data:{...}} genauso annehmen
    if (obj && obj.data && obj.data.months) obj = obj.data;
    if (!obj || typeof obj !== "object" || !obj.months || typeof obj.months !== "object") return null;
    var raw = obj.months;
    var order = obj.monthOrder || obj.month_order || Object.keys(raw);
    order = order.filter(function (n) { return raw[n]; });
    Object.keys(raw).forEach(function (n) { if (order.indexOf(n) < 0) order.push(n); });
    if (!order.length) return null;

    var months = {};
    order.forEach(function (name) {
      var m = raw[name] || {};
      var rate = Number(m.wechselkurs) || 38.4;
      // neues Format bevorzugen, sonst aus dem alten EUR-Gehalt umrechnen
      var bruttoThb = m.gehaltBruttoThb != null ? m.gehaltBruttoThb : m.gehalt_brutto_thb;
      if (bruttoThb == null) {
        var altEur = m.gehaltBruttoEur != null ? m.gehaltBruttoEur : m.gehalt_brutto_eur;
        bruttoThb = (Number(altEur) || 0) * rate;
      }
      var steuerWert = m.steuerWert != null ? m.steuerWert : m.steuer_wert;
      var steuerArt = m.steuerArt || m.steuer_art;
      if (steuerWert == null) { steuerWert = (Number(m.steuersatz) || 0) * 100; steuerArt = "pct"; }

      months[name] = {
        wechselkurs: rate,
        kursDatum: m.kursDatum || m.kurs_datum || "",
        gehaltBruttoThb: Number(bruttoThb) || 0,
        steuerWert: Number(steuerWert) || 0,
        steuerArt: steuerArt === "thb" ? "thb" : "pct",
        sozialWert: Number(m.sozialWert != null ? m.sozialWert : m.sozial_wert) || 0,
        sozialArt: (m.sozialArt || m.sozial_art) === "thb" ? "thb" : "pct",
        ausgaben: (m.ausgaben || []).map(function (i) {
          var de = i.nameDe || i.name_de || "";
          var th = i.nameTh || i.name_th || "";
          // alte Terminal-Skripte kannten nur ein einzelnes "name"-Feld
          if (!de && !th) { de = th = i.name || ""; }
          var ist = i.istBetrag != null ? i.istBetrag : i.ist_betrag;
          return { nameDe: de || th, nameTh: th || de,
                   istBetrag: (ist == null || isNaN(Number(ist))) ? null : Number(ist),
                   eintraege: i.eintraege || [],
                   kommentarDe: i.kommentarDe || i.kommentar_de || "",
                   kommentarTh: i.kommentarTh || i.kommentar_th || "",
                   betrag: Number(i.betrag) || 0,
                   waehrung: i.waehrung === "EUR" ? "EUR" : "THB" };
        })
      };
    });

    var cur = obj.currentMonth || obj.current_month || "";
    if (!months[cur]) cur = order[0];
    var lang = (obj.language === "th" || obj.language === "de") ? obj.language : state.language;
    return { language: lang, currentMonth: cur, months: months };
  }

  // Beim Export zusaetzlich die alten Feldnamen mitschreiben, damit aeltere
  // App-Versionen die Datei noch lesen koennen.
  function exportMonths() {
    var out = {};
    Object.keys(state.months).forEach(function (name) {
      var m = state.months[name];
      var copy = JSON.parse(JSON.stringify(m));
      copy.gehaltBruttoEur = m.wechselkurs ? m.gehaltBruttoThb / m.wechselkurs : 0;
      copy.steuersatz = m.steuerArt === "pct" ? m.steuerWert / 100 : 0;
      out[name] = copy;
    });
    return out;
  }

  function exportData() {
    var payload = {
      app: "BudgetKohSamui", version: 1, exportedAt: new Date().toISOString(),
      data: {
        language: state.language,
        currentMonth: state.currentMonth,
        monthOrder: Object.keys(state.months),
        months: exportMonths()
      }
    };
    var text = JSON.stringify(payload, null, 2);
    var name = "budget-koh-samui.json";
    var blob = new Blob([text], { type: "application/json" });

    // iOS: Teilen-Dialog erlaubt "In Dateien sichern" (iCloud Drive)
    if (navigator.canShare && navigator.share) {
      try {
        var file = new File([blob], name, { type: "application/json" });
        if (navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: name }).catch(function () {});
          return;
        }
      } catch (e) {}
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    alert(t("exportDone"));
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed = null;
      try { parsed = normalizeImported(JSON.parse(reader.result)); } catch (e) {}
      if (!parsed) { alert(t("importError")); return; }
      if (!confirm(t("importConfirm"))) return;
      state = parsed;
      save(state);
      renderAll();
      alert(t("importDone").replace("{months}", Object.keys(state.months).length));
    };
    reader.onerror = function () { alert(t("importError")); };
    reader.readAsText(file);
  }

  document.getElementById("btnExport").addEventListener("click", exportData);
  document.getElementById("btnImport").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = "";           // gleiche Datei erneut wählbar machen
    if (file) importData(file);
  });

  // ---------------------------------------------------------------- tabs
  document.getElementById("tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll("nav.tabbar button").forEach(function (b) { b.classList.toggle("active", b === btn); });
    document.querySelectorAll("main .tab").forEach(function (s) { s.classList.toggle("active", s.id === "tab-" + activeTab); });
  });

  document.getElementById("langSwitch").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    state.language = btn.dataset.lang;
    save(state);
    renderAll();
  });

  document.getElementById("btnApply").addEventListener("click", function () {
    var rate = parseFloat(String(document.getElementById("input_rate").value).replace(",", "."));
    var salary = parseFloat(String(document.getElementById("input_salary").value).replace(",", "."));
    var tax = parseFloat(String(document.getElementById("input_tax").value).replace(",", "."));
    var social = parseFloat(String(document.getElementById("input_social").value).replace(",", "."));
    if (isNaN(rate) || isNaN(salary) || isNaN(tax) || isNaN(social) || rate <= 0) { alert(t("invalidNumber")); return; }
    var month = currentMonth();
    // von Hand geaenderter Kurs ist nicht mehr der abgerufene Tageskurs
    if (rate !== month.wechselkurs) month.kursDatum = "";
    month.wechselkurs = rate;
    month.gehaltBruttoThb = salary;
    month.steuerWert = tax;
    month.sozialWert = social;
    save(state);
    renderOverview();
    renderExpenses();
    renderHistory();
  });

  document.getElementById("btnFetchRate").addEventListener("click", function () {
    var btn = this, info = document.getElementById("lbl_rate_info");
    btn.disabled = true;
    info.textContent = t("rateUpdating");
    fetchRate().then(function (p) {
      var month = currentMonth();
      month.wechselkurs = p[0];
      month.kursDatum = p[1];
      save(state);
      renderAll();
    }).catch(function () {
      alert(t("rateError"));
      renderOverview();
    }).then(function () { btn.disabled = false; });
  });

  document.getElementById("btnAddExpense").addEventListener("click", function () { openExpenseSheet(null); });

  document.getElementById("btnCopyPlan").addEventListener("click", function () {
    if (!confirm(t("copyPlanConfirm"))) return;
    currentMonth().ausgaben.forEach(function (i) { if (istOffen(i)) i.istBetrag = i.betrag; });
    save(state); renderAll();
  });
  document.getElementById("btnClearActual").addEventListener("click", function () {
    if (!confirm(t("clearActualConfirm"))) return;
    currentMonth().ausgaben.forEach(function (i) { i.istBetrag = null; i.eintraege = []; });
    save(state); renderAll();
  });

  // ---------------------------------------------------------------- sheets
  var overlay = document.getElementById("sheetOverlay");
  var sheetContent = document.getElementById("sheetContent");

  function closeSheet() { overlay.classList.remove("open"); }
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeSheet(); });

  function openExpenseSheet(idx) {
    var month = currentMonth();
    var editing = idx !== null;
    var item = editing ? month.ausgaben[idx]
      : { nameDe: "", nameTh: "", betrag: "", waehrung: "THB", istBetrag: null, kommentarDe: "", kommentarTh: "" };
    sheetContent.innerHTML =
      '<div class="sheet-handle"></div>' +
      '<h3>' + (editing ? t("editExpense") : t("addExpense")) + '</h3>' +
      '<div class="field"><label>' + t("nameDe") + '</label><input type="text" id="sh_name_de" value="' + escapeHtml(item.nameDe || "") + '"></div>' +
      '<div class="field"><label>' + t("nameTh") + '</label><input type="text" id="sh_name_th" value="' + escapeHtml(item.nameTh || "") + '"></div>' +
      '<div class="field"><label>' + t("amount") + '</label><input type="number" inputmode="decimal" step="0.01" id="sh_amount" value="' + (item.betrag === "" ? "" : item.betrag) + '"></div>' +
      '<div class="field"><label>' + t("commentDe") + '</label><input type="text" id="sh_komm_de" value="' + escapeHtml(item.kommentarDe || "") + '"></div>' +
      '<div class="field"><label>' + t("commentTh") + '</label><input type="text" id="sh_komm_th" value="' + escapeHtml(item.kommentarTh || "") + '"></div>' +
      '<div class="field"><label>' + t("currency") + '</label><select id="sh_currency">' +
        '<option value="THB"' + (item.waehrung === "THB" ? " selected" : "") + '>THB</option>' +
        '<option value="EUR"' + (item.waehrung === "EUR" ? " selected" : "") + '>EUR</option>' +
      '</select></div>' +
      '<div class="sheet-actions">' +
        (editing ? '<button class="btn btn-danger" id="sh_delete">' + t("delete") + '</button>' : '') +
        '<button class="btn btn-ghost" id="sh_cancel">' + t("cancel") + '</button>' +
        '<button class="btn btn-primary" id="sh_save" style="margin-top:0">' + t("save") + '</button>' +
      '</div>';
    overlay.classList.add("open");
    document.getElementById("sh_cancel").onclick = closeSheet;
    if (editing) {
      document.getElementById("sh_delete").onclick = function () {
        month.ausgaben.splice(idx, 1);
        save(state); closeSheet(); renderExpenses(); renderOverview(); renderHistory();
      };
    }
    document.getElementById("sh_save").onclick = function () {
      var nameDe = document.getElementById("sh_name_de").value.trim();
      var nameTh = document.getElementById("sh_name_th").value.trim();
      var amount = parseFloat(String(document.getElementById("sh_amount").value).replace(",", "."));
      var currency = document.getElementById("sh_currency").value;
      if (!nameDe && !nameTh) { alert(t("nameRequired")); return; }
      if (isNaN(amount)) { alert(t("invalidNumber")); return; }
      // if one language was left blank, fall back to the other so both stay populated
      nameDe = nameDe || nameTh;
      nameTh = nameTh || nameDe;
      var kommDe = document.getElementById("sh_komm_de").value.trim();
      var kommTh = document.getElementById("sh_komm_th").value.trim();
      if (editing) {
        item.nameDe = nameDe; item.nameTh = nameTh;
        item.betrag = amount; item.waehrung = currency;
        item.kommentarDe = kommDe; item.kommentarTh = kommTh;
      } else {
        month.ausgaben.push({ nameDe: nameDe, nameTh: nameTh, betrag: amount, waehrung: currency,
                              istBetrag: null, eintraege: [], kommentarDe: kommDe, kommentarTh: kommTh });
      }
      save(state); closeSheet(); renderExpenses(); renderOverview(); renderHistory();
    };
  }

  function openNewMonthSheet() {
    sheetContent.innerHTML =
      '<div class="sheet-handle"></div>' +
      '<h3>' + t("newMonth") + '</h3>' +
      '<div class="field"><label>' + t("newMonthPrompt") + '</label><input type="text" id="sh_month_name" placeholder="Sep 2026"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="sh_cancel">' + t("cancel") + '</button>' +
        '<button class="btn btn-primary" id="sh_save" style="margin-top:0">' + t("create") + '</button>' +
      '</div>';
    overlay.classList.add("open");
    document.getElementById("sh_cancel").onclick = closeSheet;
    document.getElementById("sh_save").onclick = function () {
      var name = document.getElementById("sh_month_name").value.trim();
      if (!name) return;
      if (state.months[name]) { alert(t("monthExists")); }
      else {
        var kopie = JSON.parse(JSON.stringify(currentMonth()));
        // geplante Werte uebernehmen, Ist-Werte des Vormonats aber leeren
        kopie.ausgaben.forEach(function (i) { i.istBetrag = null; i.eintraege = []; });
        state.months[name] = kopie;
      }
      state.currentMonth = name;
      save(state); closeSheet(); renderAll();
    };
  }

  renderAll();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
